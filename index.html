
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The — Illuminated Entrance</title>

<!-- Medieval-style fonts from Google Fonts (needs internet, which GitHub Pages has) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=UnifrakturMaguntia&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #3a2615 0%, #1a0f07 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 16px; box-sizing: border-box;
    font-family: 'IM Fell English SC', Georgia, serif;
  }
  #stage {
    width: 100%; max-width: 980px; height: auto; cursor: pointer;
    box-shadow: 0 25px 70px rgba(0,0,0,.65), 0 0 0 6px #4b2f17, 0 0 0 9px #2a1809;
    border-radius: 3px;
  }
  button {
    font: inherit; letter-spacing: .15em; font-size: 16px;
    color: #f3d98a; background: #5a1d1d; border: 2px solid #d9b350;
    padding: 8px 22px; cursor: pointer; border-radius: 2px;
    transition: background .2s, transform .2s;
  }
  button:hover { background: #7a2626; transform: translateY(-1px); }

  /* ---------- reusable animation building blocks ---------- */

  /* "pen draws a line": use on any path that has pathLength="1" */
  .draw {
    opacity: 0; --len: 1;
    stroke-dasharray: var(--len) var(--len);
    stroke-dashoffset: var(--len);
    animation: draw var(--t, 2s) var(--d, 0s) ease-in-out forwards;
  }
  .draw.linear { animation-timing-function: linear; }
  @keyframes draw {
    from { opacity: 1; stroke-dashoffset: var(--len); }
    to   { opacity: 1; stroke-dashoffset: 0; }
  }

  /* simple fade in */
  .fade { opacity: 0; animation: fade var(--t, 1s) var(--d, 0s) ease forwards; }
  @keyframes fade { to { opacity: 1; } }

  /* leaves, berries, corner knots "pop" into existence */
  .pop { transform: scale(0); animation: pop .6s var(--d, 0s) cubic-bezier(.3, 1.6, .5, 1) forwards; }
  @keyframes pop { to { transform: scale(1); } }

  /* glittering gold dust */
  .tw { opacity: 0; transform: scale(.3);
        animation: twinkle var(--t, 3s) var(--d, 5s) ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3); }
                       50%      { opacity: 1; transform: scale(1); } }

  /* ---------- the lettering ---------- */
  .tx {
    opacity: 0; fill-opacity: 0;
    stroke-dasharray: 4000 4000; stroke-dashoffset: 4000;
    stroke-linejoin: round; stroke-linecap: round;
  }
  /* big gold "T": outline is drawn, then gold floods in */
  .tx.t1 { animation: txdraw 1.8s 1.4s ease-in-out forwards,
                      txfill1 .9s 2.9s ease forwards; }
  /* blackletter "he": outline is inked, then filled solid */
  .tx.t2 { animation: txdraw 2.2s 3.0s ease-in-out forwards,
                      txfill2 .9s 4.9s ease forwards; }
  @keyframes txdraw {
    from { opacity: 1; stroke-dashoffset: 4000; }
    to   { opacity: 1; stroke-dashoffset: 0; }
  }
  @keyframes txfill1 {
    from { opacity: 1; fill-opacity: 0; stroke: #ffe9a8; }
    to   { opacity: 1; fill-opacity: 1; stroke: #4a2c08; }
  }
  @keyframes txfill2 {
    from { opacity: 1; fill-opacity: 0; }
    to   { opacity: 1; fill-opacity: 1; }
  }

  /* golden light sweeping across the T (repeats slowly) */
  .shine { animation: shine 5s 5.4s ease-in-out infinite; transform: translateX(-200px) skewX(-20deg); }
  @keyframes shine {
    0%   { transform: translateX(-200px) skewX(-20deg); }
    40%  { transform: translateX(520px)  skewX(-20deg); }
    100% { transform: translateX(520px)  skewX(-20deg); }
  }

  /* respect people who turn animations off: jump straight to the finished page */
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-delay: 0s !important;
        animation-iteration-count: 1 !important; }
  }
</style>
</head>

<body>
  <svg id="stage" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="Illuminated manuscript title: The"></svg>
  <button id="replay" type="button">↻ Replay</button>

<script>
/* =====================================================================
   CHANGE THIS to make a new entrance later, e.g.
     { initial: "T", rest: "he Lord", subtitle: "of the Rings" }
   (Longer titles will need a smaller font size / extra lines – see notes.)
   ===================================================================== */
const ENTRANCE = {
  initial:  "T",
  rest:     "he",
  subtitle: "— a tale begins —"
};

/* ---------- tiny helper to create SVG elements ---------- */
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs = {}, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* ---------- static artwork (parchment, border, block, lettering) ---------- */
function staticMarkup(ent) {
  return `
  <defs>
    <!-- parchment texture -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="stains" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .33  0 0 0 0 .12  1.3 0 0 0 -.5"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#6b3f12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a2606" stop-opacity=".55"/>
    </radialGradient>

    <!-- hand-inked wobble for the blackletter -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>

    <!-- gold leaf -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#fff0b0"/>
      <stop offset=".28" stop-color="#e2b347"/>
      <stop offset=".55" stop-color="#a97418"/>
      <stop offset=".8"  stop-color="#f1cf6c"/>
      <stop offset="1"   stop-color="#b8821f"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- blue lattice behind the initial -->
    <pattern id="lattice" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="#1b2c6b"/>
      <path d="M0 0H26" stroke="#3050a8" stroke-width="2"/>
      <path d="M0 0V26" stroke="#3050a8" stroke-width="2"/>
      <circle cx="13" cy="13" r="2.4" fill="#d9b350"/>
    </pattern>

    <clipPath id="tclip">
      <text x="240" y="455" text-anchor="middle" font-size="300"
            font-family="'Uncial Antiqua', serif">${esc(ent.initial)}</text>
    </clipPath>
  </defs>

  <!-- PAGE -->
  <rect width="1000" height="700" fill="#efe0b8"/>
  <rect width="1000" height="700" filter="url(#stains)" opacity=".55"/>
  <rect width="1000" height="700" filter="url(#grain)" opacity=".10" style="mix-blend-mode:multiply"/>
  <rect width="1000" height="700" fill="url(#vignette)"/>

  <!-- DOUBLE BORDER (drawn by the pen) -->
  <path class="draw" pathLength="1" style="--t:2.2s;--d:.1s" d="M24 24 H976 V676 H24 Z"
        fill="none" stroke="#2a1608" stroke-width="3"/>
  <path class="draw" pathLength="1" style="--t:2.2s;--d:.5s" d="M42 42 H958 V658 H42 Z"
        fill="none" stroke="#8a1c1c" stroke-width="1.6"/>
  ${[[33,33],[967,33],[33,667],[967,667]].map(([x,y],i)=>`
    <g transform="translate(${x} ${y})"><g class="pop" style="--d:${1.6+i*.15}s">
      <circle r="7.5" fill="url(#gold)" stroke="#2a1608" stroke-width="1.4"/>
      <circle r="2.6" fill="#8a1c1c"/>
    </g></g>`).join("")}

  <!-- VINES go here (added by JS, drawn behind the block) -->
  <g id="vines"></g>

  <!-- ILLUMINATED INITIAL BLOCK -->
  <g class="fade" style="--d:.8s;--t:1s">
    <rect x="90" y="200" width="300" height="300" fill="url(#lattice)"/>
    <rect x="104" y="214" width="272" height="272" fill="none" stroke="#d9b350" stroke-width="2"/>
  </g>
  <path class="draw" pathLength="1" style="--t:1.4s;--d:.9s" d="M90 200 H390 V500 H90 Z"
        fill="none" stroke="url(#gold)" stroke-width="9" stroke-linejoin="miter"/>
  <path class="draw" pathLength="1" style="--t:1.4s;--d:1.1s" d="M82 192 H398 V508 H82 Z"
        fill="none" stroke="#2a1608" stroke-width="1.6"/>

  <!-- the big gold T -->
  <text class="tx t1" x="240" y="455" text-anchor="middle" font-size="300"
        font-family="'Uncial Antiqua', serif" fill="url(#gold)" stroke="#ffe9a8"
        stroke-width="3">${esc(ent.initial)}</text>
  <g clip-path="url(#tclip)">
    <rect class="shine" x="0" y="190" width="110" height="320" fill="url(#shineGrad)"/>
  </g>

  <!-- the blackletter rest of the word -->
  <text class="tx t2" x="415" y="455" font-size="230"
        font-family="'UnifrakturMaguntia', serif" fill="#2a1608" stroke="#2a1608"
        stroke-width="2.5" filter="url(#ink)">${esc(ent.rest)}</text>

  <!-- red quill flourish under the word -->
  <path class="draw" pathLength="1" style="--t:1.2s;--d:5.2s"
        d="M420 492 C 500 520, 610 520, 705 488 C 735 478, 760 490, 745 503 C 735 511, 722 500, 733 494"
        fill="none" stroke="#8a1c1c" stroke-width="3.2" stroke-linecap="round"/>

  <!-- subtitle -->
  <text class="fade" style="--d:5.8s;--t:1.4s" x="500" y="648" text-anchor="middle"
        font-family="'IM Fell English SC', serif" font-size="26" letter-spacing="6"
        fill="#8a1c1c">${esc(ent.subtitle || "")}</text>

  <!-- gold dust -->
  <g id="dust"></g>
  `;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------- vines: a path draws itself, leaves pop out where the tip passes ---------- */
function growVine(parent, d, { delay = 2, dur = 2.4, leafEvery = 38, scale = 1, flip = 1 } = {}) {
  // dark green stem + thin gold highlight on top
  const stem = el("path", { d, pathLength: 1, class: "draw linear", fill: "none",
    stroke: "#2c4a2a", "stroke-width": 5, "stroke-linecap": "round",
    style: `--t:${dur}s;--d:${delay}s` }, parent);
  el("path", { d, pathLength: 1, class: "draw linear", fill: "none",
    stroke: "#e2b347", "stroke-width": 1.4, "stroke-linecap": "round",
    style: `--t:${dur}s;--d:${delay}s` }, parent);

  const L = stem.getTotalLength();
  const colors = ["#2f5d3a", "#3f7a45", "#2a4d33", "#4b8a4f"];
  let n = 0;

  for (let s = 24; s < L * 0.88; s += leafEvery, n++) {
    const f = s / L;
    const p  = stem.getPointAtLength(s);
    const p2 = stem.getPointAtLength(s + 1);
    const tan = Math.atan2(p2.y - p.y, p2.x - p.x) * 180 / Math.PI;
    const side = (n % 2 === 0 ? 1 : -1) * flip;
    const size = scale * (1.05 - 0.45 * f);
    const t = delay + f * dur + 0.15;               // appear just after the vine tip passes

    // leaf
    const g = el("g", { transform: `translate(${p.x} ${p.y}) rotate(${tan + side * 52})` }, parent);
    const pop = el("g", { class: "pop", style: `--d:${t}s` }, g);
    const sg = el("g", { transform: `scale(${size})` }, pop);
    el("path", { d: "M0 0 C 10 -16, 34 -16, 46 0 C 34 16, 10 16, 0 0Z",
      fill: colors[n % colors.length], stroke: "#16260f", "stroke-width": 1.2 }, sg);
    el("path", { d: "M3 0 L40 0", stroke: "#e2b347", "stroke-width": 1, "stroke-linecap": "round" }, sg);

    // a crimson berry every third leaf
    if (n % 3 === 1) {
      const nx = -Math.sin(tan * Math.PI / 180) * -side * 15;
      const ny =  Math.cos(tan * Math.PI / 180) * -side * 15;
      const b = el("g", { transform: `translate(${p.x + nx} ${p.y + ny})` }, parent);
      const bp = el("g", { class: "pop", style: `--d:${t + .15}s` }, b);
      el("circle", { r: 5.5 * scale, fill: "#9c1f2b", stroke: "#3a0b10", "stroke-width": 1.2 }, bp);
      el("circle", { r: 1.6 * scale, cx: -1.5, cy: -1.5, fill: "#ffd2d2" }, bp);
    }
  }
}

function addVines() {
  const g = document.getElementById("vines");
  const wrap = el("g", { transform: "translate(0 10)" }, g);

  // top-right, bottom-right, top-left, bottom-left
  growVine(wrap, "M370 240 C 440 130, 540 170, 610 130 S 770 100, 830 150 S 890 190, 865 235 C 845 270, 795 258, 805 225 C 812 202, 842 207, 838 226",
           { delay: 1.9, dur: 2.6 });
  growVine(wrap, "M370 440 C 450 560, 560 520, 640 560 S 800 600, 860 540 C 900 495, 850 455, 820 485 C 800 506, 828 524, 842 506",
           { delay: 2.1, dur: 2.6, flip: -1 });
  growVine(wrap, "M130 240 C 60 180, 80 100, 150 90 C 200 83, 215 140, 175 150 C 148 156, 140 124, 160 118",
           { delay: 2.3, dur: 2.0, leafEvery: 34, scale: .9, flip: -1 });
  growVine(wrap, "M130 460 C 60 520, 90 600, 160 600 C 210 600, 220 545, 180 540 C 155 538, 152 566, 170 568",
           { delay: 2.5, dur: 2.0, leafEvery: 34, scale: .9 });
}

/* ---------- sparkles around the gold letter ---------- */
function addDust(count = 26) {
  const g = document.getElementById("dust");
  for (let i = 0; i < count; i++) {
    const x = 60 + Math.random() * 380;
    const y = 170 + Math.random() * 360;
    const r = 1.5 + Math.random() * 2.4;
    const wrap = el("g", { transform: `translate(${x} ${y})` }, g);
    el("circle", { class: "tw", r, fill: "#ffe9a8",
      style: `--d:${(3.5 + Math.random() * 5).toFixed(2)}s;--t:${(2 + Math.random() * 2.5).toFixed(2)}s` }, wrap);
  }
}

/* ---------- play / replay ---------- */
function render() {
  const stage = document.getElementById("stage");
  stage.innerHTML = staticMarkup(ENTRANCE);   // rebuilding the SVG restarts every animation
  addVines();
  addDust();
}

// wait for the fonts so the lettering is measured correctly, then play
Promise.race([
  Promise.all([
    document.fonts.load('300px "Uncial Antiqua"'),
    document.fonts.load('230px "UnifrakturMaguntia"'),
    document.fonts.load('26px "IM Fell English SC"')
  ]),
  new Promise(r => setTimeout(r, 2000))      // don't wait forever if offline
]).then(render, render);

document.getElementById("replay").addEventListener("click", render);
document.getElementById("stage").addEventListener("click", render);
</script>
</body>
</html>
